services:
  # =============================================================================
  # Customer Database Services (one per replica)
  # =============================================================================
  customerdb_0:
    build:
      context: ./DB/customer
      dockerfile: Dockerfile
    container_name: customerdb_0
    restart: unless-stopped
    ports:
      - "8000:3306"
    networks:
      - marketplace_network

  customerdb_1:
    build:
      context: ./DB/customer
      dockerfile: Dockerfile
    container_name: customerdb_1
    restart: unless-stopped
    ports:
      - "8001:3306"
    networks:
      - marketplace_network

  customerdb_2:
    build:
      context: ./DB/customer
      dockerfile: Dockerfile
    container_name: customerdb_2
    restart: unless-stopped
    ports:
      - "8002:3306"
    networks:
      - marketplace_network

  customerdb_3:
    build:
      context: ./DB/customer
      dockerfile: Dockerfile
    container_name: customerdb_3
    restart: unless-stopped
    ports:
      - "8003:3306"
    networks:
      - marketplace_network

  customerdb_4:
    build:
      context: ./DB/customer
      dockerfile: Dockerfile
    container_name: customerdb_4
    restart: unless-stopped
    ports:
      - "8004:3306"
    networks:
      - marketplace_network

  customerdb_5:
    build:
      context: ./DB/customer
      dockerfile: Dockerfile
    container_name: customerdb_5
    restart: unless-stopped
    ports:
      - "8005:3306"
    networks:
      - marketplace_network

# =============================================================================
# Networks
# =============================================================================
networks:
  marketplace_network:
    driver: bridge